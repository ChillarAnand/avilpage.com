<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" viewport="0 0 1280px 960px">
  <!-- sky -->
  <rect width="800" height="600" fill="#cfe8f7"/>
  <circle cx="700" cy="85" r="38" fill="#ffd166"/>
  <!-- ground -->
  <line x1="0" y1="488" x2="800" y2="488" stroke="#8d6e4a" stroke-width="6"/>
  <!-- speed lines -->
  <g stroke="#9ec9e8" stroke-width="6" stroke-linecap="round">
    <line x1="60" y1="300" x2="140" y2="300"/>
    <line x1="40" y1="345" x2="130" y2="345"/>
    <line x1="70" y1="390" x2="145" y2="390"/>
  </g>

  <!-- far pedal (behind frame) -->
  <line x1="390" y1="430" x2="362" y2="402" stroke="#2b2b2b" stroke-width="6"/>
  <rect x="346" y="396" width="30" height="9" rx="4" fill="#333"/>

  <!-- wheels -->
  <g fill="none" stroke="#2b2b2b" stroke-width="6">
    <circle cx="240" cy="430" r="58"/>
    <circle cx="560" cy="430" r="58"/>
  </g>
  <g stroke="#2b2b2b" stroke-width="3">
    <line x1="182" y1="430" x2="298" y2="430"/>
    <line x1="240" y1="372" x2="240" y2="488"/>
    <line x1="200" y1="390" x2="280" y2="470"/>
    <line x1="280" y1="390" x2="200" y2="470"/>
    <line x1="502" y1="430" x2="618" y2="430"/>
    <line x1="560" y1="372" x2="560" y2="488"/>
    <line x1="520" y1="390" x2="600" y2="470"/>
    <line x1="600" y1="390" x2="520" y2="470"/>
  </g>
  <circle cx="240" cy="430" r="8" fill="#2b2b2b"/>
  <circle cx="560" cy="430" r="8" fill="#2b2b2b"/>

  <!-- far leg + foot (behind frame) -->
  <path d="M 352,246 L 356,336 L 362,396" fill="none" stroke="#2b2b2b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="348,398 376,398 362,384" fill="#f7f3ea" stroke="#2b2b2b" stroke-width="3"/>

  <!-- frame -->
  <g stroke="#d64541" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="240" y1="430" x2="390" y2="430"/>
    <line x1="390" y1="430" x2="360" y2="290"/>
    <line x1="360" y1="290" x2="525" y2="290"/>
    <line x1="390" y1="430" x2="525" y2="290"/>
    <line x1="240" y1="430" x2="360" y2="290"/>
    <line x1="525" y1="290" x2="560" y2="430"/>
  </g>
  <!-- handlebar stem + bar -->
  <line x1="525" y1="290" x2="518" y2="252" stroke="#2b2b2b" stroke-width="7" stroke-linecap="round"/>
  <line x1="498" y1="250" x2="534" y2="250" stroke="#2b2b2b" stroke-width="9" stroke-linecap="round"/>
  <!-- seat post + saddle -->
  <line x1="360" y1="290" x2="354" y2="276" stroke="#2b2b2b" stroke-width="6"/>
  <ellipse cx="352" cy="272" rx="24" ry="8" fill="#2f2f2f"/>

  <!-- crank -->
  <circle cx="390" cy="430" r="18" fill="#2b2b2b"/>
  <line x1="390" y1="430" x2="418" y2="458" stroke="#2b2b2b" stroke-width="6"/>
  <rect x="404" y="452" width="34" height="9" rx="4" fill="#333"/>

  <!-- pelican -->
  <!-- tail -->
  <path d="M 308,196 L 276,178 L 292,204 L 272,212 L 304,220 Z" fill="#f7f3ea" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
  <!-- body -->
  <ellipse cx="350" cy="208" rx="50" ry="40" fill="#f7f3ea" stroke="#2b2b2b" stroke-width="4"/>
  <!-- wing -->
  <path d="M 320,196 Q 352,178 386,196 Q 372,224 336,222 Q 318,214 320,196 Z" fill="#e9e2d2" stroke="#2b2b2b" stroke-width="3"/>
  <!-- neck -->
  <path d="M 372,178 C 380,140 400,130 428,116" fill="none" stroke="#2b2b2b" stroke-width="20" stroke-linecap="round"/>
  <path d="M 372,178 C 380,140 400,130 428,116" fill="none" stroke="#f7f3ea" stroke-width="15" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="432" cy="112" r="15" fill="#f7f3ea" stroke="#2b2b2b" stroke-width="3"/>
  <!-- beak + pouch -->
  <path d="M 444,102 L 568,124 L 562,140 C 520,162 470,140 448,114 Z" fill="#f2a541" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
  <!-- eye -->
  <circle cx="429" cy="104" r="3.2" fill="#2b2b2b"/>
  <circle cx="428" cy="103" r="1" fill="#fff"/>
  <!-- wing-arm to handlebar -->
  <path d="M 382,192 Q 450,215 505,250" fill="none" stroke="#2b2b2b" stroke-width="16" stroke-linecap="round"/>
  <path d="M 382,192 Q 450,215 505,250" fill="none" stroke="#f7f3ea" stroke-width="11" stroke-linecap="round"/>
  <!-- near leg -->
  <path d="M 366,246 L 400,348 L 412,446" fill="none" stroke="#2b2b2b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- near foot on pedal -->
  <polygon points="404,452 438,452 420,436" fill="#f7f3ea" stroke="#2b2b2b" stroke-width="3"/>
</svg>