<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" fill="none" viewport="0 0 1280px 975px">
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 H0 V22" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    <style>
      .dim { fill: #64748b; font-family: 'Inter', sans-serif; font-size: 9px; text-anchor: middle; }
      @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
      .lit { animation: pulse 2.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .lit { animation: none; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="420" height="320" fill="#f8fafc"/>
  <rect width="420" height="320" fill="url(#grid)" opacity="0.7"/>

  <!-- Title -->
  <text fill="#0f172a" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle" x="210" y="26">Qwen 27B vs Qwen 35B-A3B</text>
  <text class="dim" x="210" y="41" font-size="10" fill="#475569">same inference cost &#8212; far more total knowledge</text>

  <!-- Divider -->
  <line x1="210" y1="55" x2="210" y2="256" stroke="#cbd5e1" stroke-width="1"/>

  <!-- LEFT: DENSE (Qwen 27B) -->
  <text fill="#0369a1" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="105" y="72">QWEN 27B</text>
  <text class="dim" x="105" y="85" fill="#475569">dense &#8212; every param fires</text>

  <!-- All 16 cells solid blue -->
  <g fill="#38bdf8">
    <rect x="49" y="100" width="22" height="22" rx="3"/>
    <rect x="77" y="100" width="22" height="22" rx="3"/>
    <rect x="105" y="100" width="22" height="22" rx="3"/>
    <rect x="133" y="100" width="22" height="22" rx="3"/>

    <rect x="49" y="128" width="22" height="22" rx="3"/>
    <rect x="77" y="128" width="22" height="22" rx="3"/>
    <rect x="105" y="128" width="22" height="22" rx="3"/>
    <rect x="133" y="128" width="22" height="22" rx="3"/>

    <rect x="49" y="156" width="22" height="22" rx="3"/>
    <rect x="77" y="156" width="22" height="22" rx="3"/>
    <rect x="105" y="156" width="22" height="22" rx="3"/>
    <rect x="133" y="156" width="22" height="22" rx="3"/>

    <rect x="49" y="184" width="22" height="22" rx="3"/>
    <rect x="77" y="184" width="22" height="22" rx="3"/>
    <rect x="105" y="184" width="22" height="22" rx="3"/>
    <rect x="133" y="184" width="22" height="22" rx="3"/>
  </g>
  <text class="dim" x="105" y="228" fill="#475569">27B params = 27B of work</text>

  <!-- RIGHT: MoE (Qwen 35B-A3B) -->
  <text fill="#9333ea" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle" x="315" y="72">QWEN 35B-A3B</text>
  <text class="dim" x="315" y="85" fill="#475569">MoE &#8212; only top experts activate</text>

  <!-- 16 cells, 4 active (pulsing purple), rest dim -->
  <g stroke="#cbd5e1" stroke-width="1">
    <rect x="253" y="100" width="22" height="22" rx="3" fill="#e2e8f0"/>
    <rect x="281" y="100" width="22" height="22" rx="3" fill="#d946ef" class="lit" stroke="#9333ea"/>
    <rect x="309" y="100" width="22" height="22" rx="3" fill="#e2e8f0"/>
    <rect x="337" y="100" width="22" height="22" rx="3" fill="#e2e8f0"/>

    <rect x="253" y="128" width="22" height="22" rx="3" fill="#e2e8f0"/>
    <rect x="281" y="128" width="22" height="22" rx="3" fill="#e2e8f0"/>
    <rect x="309" y="128" width="22" height="22" rx="3" fill="#d946ef" class="lit" stroke="#9333ea"/>
    <rect x="337" y="128" width="22" height="22" rx="3" fill="#e2e8f0"/>

    <rect x="253" y="156" width="22" height="22" rx="3" fill="#d946ef" class="lit" stroke="#9333ea"/>
    <rect x="281" y="156" width="22" height="22" rx="3" fill="#e2e8f0"/>
    <rect x="309" y="156" width="22" height="22" rx="3" fill="#e2e8f0"/>
    <rect x="337" y="156" width="22" height="22" rx="3" fill="#e2e8f0"/>

    <rect x="253" y="184" width="22" height="22" rx="3" fill="#e2e8f0"/>
    <rect x="281" y="184" width="22" height="22" rx="3" fill="#e2e8f0"/>
    <rect x="309" y="184" width="22" height="22" rx="3" fill="#e2e8f0"/>
    <rect x="337" y="184" width="22" height="22" rx="3" fill="#d946ef" class="lit" stroke="#9333ea"/>
  </g>
  <text class="dim" x="315" y="228" fill="#475569">35B params = ~3.6B of work</text>

  <!-- Legend dots -->
  <circle cx="239" cy="248" r="5" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text font-family="Inter, sans-serif" font-size="8" fill="#94a3b8" x="248" y="252">dormant expert</text>
  <circle cx="315" cy="248" r="5" fill="#d946ef"/>
  <text font-family="Inter, sans-serif" font-size="8" fill="#94a3b8" x="324" y="252">active expert</text>

  <!-- Footer -->
  <text class="dim" x="210" y="276" font-size="10" fill="#64748b">35B knowledge base at 3.6B inference cost per token</text>
  <text class="dim" x="210" y="294" font-size="8" fill="#94a3b8">all 35B still sit in memory &#8212; MoE saves compute, not VRAM</text>
</svg>